<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cobaltGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Glow -->
  <circle cx="24" cy="24" r="22" fill="#00F5FF" fill-opacity="0.08" />
  
  <!-- Outer Orbit Ring -->
  <ellipse cx="24" cy="24" rx="20" ry="11" transform="rotate(-30 24 24)" stroke="url(#cyberCyan)" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Main Phone / Platform Silhouette -->
  <rect x="15" y="10" width="18" height="28" rx="4" transform="rotate(-12 24 24)" fill="#0F172A" stroke="url(#cyberCyan)" stroke-width="2" filter="url(#glow)" />
  <rect x="17" y="13" width="14" height="22" rx="2" transform="rotate(-12 24 24)" fill="url(#cobaltGlow)" opacity="0.85" />
  
  <!-- Neon Core Node -->
  <circle cx="24" cy="24" r="3.5" fill="#00F5FF" filter="url(#glow)" />
  <circle cx="24" cy="24" r="1.5" fill="#FFFFFF" />
</svg>
